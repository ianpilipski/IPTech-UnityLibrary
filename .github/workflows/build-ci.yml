name: CI Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  pull_request:
    branches: 
      - main
  
  workflow_dispatch:

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Test ${{ matrix.projectPath }} ${{ matrix.buildTarget }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - unity/iptech-unitylibrary
          - unity/iptech-unityservices
        buildTarget:
          - ios
          - android
        include:
          - buildTarget: ios
            buildConfig: DebugiOS
          - buildTarget: android
            buildConfig: DebugAndroid
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: LibraryBuild-${{ matrix.projectPath }}-${{ matrix.buildTarget }}

      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: auto
          projectPath: ${{ matrix.projectPath }}
          targetPlatform: ${{ matrix.buildTarget }}
          buildMethod: IPTech.BuildTool.Builder.Build
          customParameters: -buildConfig ${{ matrix.buildConfig }}

  test:
    name: Test ${{ matrix.projectPath }} ${{ matrix.buildTarget }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - unity/iptech-unitylibrary
          - unity/iptech-unityservices
        buildTarget:
          - ios
          - android
        include:
          - buildTarget: android
            image: 'unityci/editor:ubuntu-6000.5.1f1-android-3'
          - buildTarget: ios
            image: 'unityci/editor:ubuntu-6000.5.1f1-ios-3'
        
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: LibraryTest-${{ matrix.projectPath }}-${{ matrix.buildTarget }}
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          projectPath: ${{ matrix.projectPath }}
          customParameters: -buildTarget ${{ matrix.buildTarget }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customImage: ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results for ${{ matrix.projectPath }} ${{ matrix.buildTarget }}
          path: artifacts

  
